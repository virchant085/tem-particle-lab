<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEM · 颗粒追踪</title>
<style>
:root{font-family:Inter,'Segoe UI','Microsoft YaHei',sans-serif;color:#20302d;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}header{padding:20px 32px;border-bottom:1px solid #dce3dc;display:flex;align-items:center;justify-content:space-between;background:white}h1{font-size:22px;margin:0}small{color:#6b7b72}.tag{font-size:12px;color:#19644b;background:#e0f0e6;padding:6px 10px;border-radius:20px}main{display:grid;grid-template-columns:minmax(440px,1fr) 340px;gap:24px;max-width:1240px;margin:26px auto;padding:0 24px}.card{background:white;border:1px solid #dce3dc;border-radius:12px;padding:20px}.canvas-wrap{background:#1b2522;display:flex;justify-content:center;padding:12px;border-radius:8px;overflow:auto}canvas{width:100%;max-width:680px;height:auto;cursor:crosshair;touch-action:none}button,.button{border:1px solid #cbd9d0;background:white;color:#254f40;padding:10px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;display:inline-block}button:hover{background:#edf5ef}button.primary{background:#17644a;color:white;border-color:#17644a;width:100%;font-weight:600}button:disabled{opacity:.45;cursor:wait}input,select{font:inherit;border:1px solid #cbd9d0;border-radius:6px;padding:8px;max-width:100%}input[type=number]{width:90px}label{font-size:13px;display:block;margin:14px 0 6px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.control{margin-top:16px}#timeline{width:100%;padding:0;accent-color:#17644a}#targets{max-height:230px;overflow-y:auto;margin:12px 0}.target{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid #edf0eb;padding:9px 0;font-size:13px}.target button{padding:4px 8px}p{line-height:1.65;font-size:13px}.muted{color:#65766c}.notice{background:#fff7df;border:1px solid #eddda8;border-radius:7px;padding:10px;font-size:12px;line-height:1.6}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{padding:10px 0;font-size:13px;white-space:pre-wrap}details{margin:16px 0;font-size:13px}summary{cursor:pointer}#file{max-width:220px}h2{font-size:15px;margin:0 0 12px}#frameLabel{font-variant-numeric:tabular-nums;min-width:92px}#review{max-height:160px;overflow:auto;font-size:12px;line-height:1.7;color:#8c5d16}@media(max-width:900px){main{grid-template-columns:1fr;margin:12px auto}header{padding:16px}canvas{max-width:554px}}
</style>
<header><div><h1>TEM · 颗粒追踪</h1><small>点选颗粒，检查轨迹，保留每一次测量</small></div><span class="tag">本机处理 · 原视频只读</span></header>
<main><section class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span id="videoMeta">载入视频…</span><label style="margin:0"><input type="checkbox" id="showOverlay" checked> 显示轨迹</label></div>
<div class="canvas-wrap"><canvas id="canvas" width="554" height="554" aria-label="颗粒选点画布"></canvas></div>
<div class="control"><input type="range" id="timeline" min="0" max="25" value="0" aria-label="视频帧"><div class="row"><button id="prev">← 上一帧</button><button id="play">播放</button><button id="next">下一帧 →</button><span id="frameLabel">帧 0 / 25</span></div></div>
<p class="muted">在图中点击颗粒中心。绿色圆圈表示选定范围，黄色线表示观测轨迹。目标丢失时停止连线；可在当前帧添加同一 ID 的校正点，再运行。</p>
<div class="row"><input type="file" id="file" accept="video/*,.avi,.mp4"><button id="upload">打开新视频</button></div>
<div id="status" class="status" role="status"></div><div id="links" class="links"></div><div id="review"></div>
</section><aside class="card"><h2>指定目标</h2><label for="mode">点击画面的操作</label><select id="mode"><option value="new">新增一个颗粒</option></select>
<div class="row"><label for="radius">圆圈半径 <input type="number" id="radius" min="4" max="180" value="31"> px</label></div>
<div id="targets"></div><div class="row"><button id="undo">撤销选点</button><button id="clear">清空选择</button><button id="export">导出选点</button></div>
<label for="seedFile">导入之前的选点</label><input type="file" id="seedFile" accept=".json">
<details><summary>追踪参数与标定</summary><label>最大搜索位移 <input type="number" id="search" min="2" max="150" value="28"> px</label>
<label>采集帧率 <input type="number" id="fps" min="0.0001" step="any" placeholder="未标定"> fps</label>
<label>像素尺寸 <input type="number" id="nm" min="0.000001" step="any" placeholder="未标定"> nm/px</label>
<p class="muted">留空时只输出像素和视频播放时间。画面自带的时间或标尺不会自动用于科学标定。</p></details>
<button class="primary" id="run">追踪所选颗粒</button><div class="notice" style="margin-top:14px">本次首帧已确认 1、2、3、4、6、7。5 需要重新定位，8 待确认。后半段低对比目标须逐帧核查。采集帧率和 nm/px 已记录为待补。</div>
</aside></main>
<script>
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');let meta,token,particles=[],history=[],rows=[],frame=0,img=new Image(),playing=null,requestSerial=0,polling=null;
function setStatus(s){$('status').textContent=s}function snapshot(){history.push(JSON.stringify(particles))}
function targets(){let ids=[...new Set(particles.map(p=>p.id))].sort((a,b)=>a-b),selected=$('mode').value;$('targets').replaceChildren();$('mode').innerHTML='<option value="new">新增一个颗粒</option>';for(let id of ids){let a=particles.filter(p=>p.id===id);let div=document.createElement('div');div.className='target';let span=document.createElement('span');span.textContent=`#${id} · ${a.length} 个锚点 · 起始帧 ${Math.min(...a.map(p=>p.frame))}`;let b=document.createElement('button');b.textContent='移除';b.onclick=()=>{snapshot();particles=particles.filter(p=>p.id!==id);targets();draw();setStatus('选点已改变；显示的轨迹属于上次运行，请重新追踪。')};div.append(span,b);$('targets').append(div);let o=document.createElement('option');o.value=id;o.textContent=`校正颗粒 #${id}`;$('mode').append(o)}if([...$('mode').options].some(o=>o.value===selected))$('mode').value=selected}
function draw(){if(!img.complete)return;ctx.clearRect(0,0,meta.width,meta.height);ctx.drawImage(img,0,0);if($('showOverlay').checked&&rows.length){for(let id of [...new Set(rows.map(r=>r.track_id))]){let trail=rows.filter(r=>r.track_id===id&&r.frame<=frame&&r.frame>=frame-50).sort((a,b)=>a.frame-b.frame),prev=null;ctx.strokeStyle='#ffed00';ctx.lineWidth=2;for(let r of trail){if(r.observed){if(prev&&prev.frame===r.frame-1&&r.status!=='manual_anchor'){ctx.beginPath();ctx.moveTo(prev.center_x,prev.center_y);ctx.lineTo(r.center_x,r.center_y);ctx.stroke()}prev=r}else prev=null}let r=trail.find(r=>r.frame===frame);if(r&&r.observed)circle(r.center_x,r.center_y,r.radius_px,id)}}for(let p of particles.filter(p=>p.frame===frame))circle(p.x,p.y,p.radius,p.id,true)}
function circle(x,y,r,id,anchor=false){ctx.strokeStyle=anchor?'#29ff7b':'#04e331';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.stroke();ctx.fillStyle='#ffed00';ctx.beginPath();ctx.arc(x,y,2,0,2*Math.PI);ctx.fill();ctx.font='bold 15px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#132820';ctx.strokeText(id,x+r+3,y);ctx.fillStyle='#3cff70';ctx.fillText(id,x+r+3,y)}
async function show(f){frame=Math.max(0,Math.min(meta.frames-1,f));$('timeline').value=frame;$('frameLabel').textContent=`帧 ${frame} / ${meta.frames-1}`;let serial=++requestSerial,ni=new Image();ni.onload=()=>{if(serial===requestSerial){img=ni;draw()}};ni.src=`/api/frame/${frame}?v=${Date.now()}`}
async function init(){let d=await(await fetch('/api/meta')).json();meta=d.metadata;token=d.token;particles=d.seeds.particles||[];$('canvas').width=meta.width;$('canvas').height=meta.height;$('timeline').max=meta.frames-1;$('videoMeta').textContent=`${meta.width} × ${meta.height} · ${meta.frames} 帧 · 播放 ${meta.container_fps} fps`;$('search').value=d.config.tracker.search_range;$('fps').value=d.config.calibration.acquisition_fps??'';$('nm').value=d.config.calibration.nm_per_pixel??'';targets();show(0)}
$('canvas').onclick=e=>{if(playing){clearInterval(playing);playing=null;$('play').textContent='播放'}let r=$('canvas').getBoundingClientRect(),x=(e.clientX-r.left)*meta.width/r.width,y=(e.clientY-r.top)*meta.height/r.height,rad=+$('radius').value;if(!(rad>=4&&rad<=Math.min(meta.width,meta.height)/3)){setStatus('请设置有效半径');return}snapshot();let id=$('mode').value==='new'?Math.max(0,...particles.map(p=>p.id))+1:+$('mode').value;particles=particles.filter(p=>!(p.id===id&&p.frame===frame));particles.push({id,frame,x:+x.toFixed(3),y:+y.toFixed(3),radius:rad});targets();draw();setStatus(`已记录 #${id} 在帧 ${frame} 的位置；请运行以更新结果。`)};
$('timeline').oninput=()=>show(+$('timeline').value);$('prev').onclick=()=>show(frame-1);$('next').onclick=()=>show(frame+1);$('showOverlay').onchange=draw;
$('play').onclick=()=>{if(playing){clearInterval(playing);playing=null;$('play').textContent='播放'}else{$('play').textContent='暂停';playing=setInterval(()=>show(frame+1>=meta.frames?0:frame+1),1000/meta.container_fps)}};
$('undo').onclick=()=>{if(history.length){particles=JSON.parse(history.pop());targets();draw();setStatus('已撤销选点。点击追踪以更新结果。')}};$('clear').onclick=()=>{snapshot();particles=[];targets();draw();setStatus('已清空当前选择。')};
$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema_version:1,particles},null,2)],{type:'application/json'}));a.download='selected_particles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('seedFile').onchange=async()=>{try{let d=JSON.parse(await $('seedFile').files[0].text());if(!Array.isArray(d.particles)||!d.particles.every(p=>Number.isInteger(p.id)&&Number.isInteger(p.frame)&&[p.x,p.y,p.radius].every(Number.isFinite)))throw Error('选点 JSON 格式无效');snapshot();particles=d.particles;targets();draw();setStatus('选点已导入，请重新追踪。')}catch(e){setStatus(e.message)}};
async function post(url,body,type='application/json'){let r=await fetch(url,{method:'POST',headers:{'X-Session-Token':token,'Content-Type':type},body});let d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
$('upload').onclick=async()=>{try{let file=$('file').files[0];if(!file)throw Error('请先选择视频');setStatus('正在读取新视频…');await post('/api/upload',file,'application/octet-stream');rows=[];history=[];$('links').replaceChildren();$('review').textContent='';await init();setStatus('新视频已打开，请点选目标。')}catch(e){setStatus(e.message)}};
$('run').onclick=async()=>{try{if(!particles.length)throw Error('请先点选至少一个颗粒');$('run').disabled=true;rows=[];$('links').replaceChildren();$('review').textContent='';let payload={particles,search_range:+$('search').value,acquisition_fps:$('fps').value?+$('fps').value:null,nm_per_pixel:$('nm').value?+$('nm').value:null};await post('/api/run',JSON.stringify(payload));setStatus('正在追踪并生成视频…');polling=setInterval(poll,800)}catch(e){setStatus(e.message);$('run').disabled=false}};
async function poll(){try{let s=await(await fetch('/api/status')).json();if(s.busy)return;clearInterval(polling);$('run').disabled=false;if(s.error)throw Error(s.error);rows=s.result_rows;draw();let r=s.result,m=r.metrics;setStatus(`完成：${m.observed_rows}/${m.observation_rows} 个目标帧有观测，${m.review_rows} 个需复核。覆盖率不是准确率。`);for(let [name,file] of [['追踪视频','annotated.mp4'],['坐标 CSV','tracks.csv'],['统计 CSV','track_statistics.csv'],['待复核清单','review_required.csv'],['轨迹图','trajectories.png']]){let a=document.createElement('a');a.className='button';a.textContent=name;a.href=r.base+file;a.target='_blank';$('links').append(a)}let missing=rows.filter(r=>!r.observed);$('review').textContent=missing.slice(0,30).map(r=>`帧 ${r.frame} · #${r.track_id} · ${r.quality_reason||r.status}`).join('； ')}catch(e){clearInterval(polling);setStatus(e.message);$('run').disabled=false}}
init().catch(e=>setStatus(e.message));
</script></html>
