name: 测试反馈
description: 报告安装、标注、训练、识别、追踪或导出问题
title: "[测试] "
labels:
  - testing
body:
  - type: markdown
    attributes:
      value: |
        感谢测试。请勿上传未经授权的 TEM 原始视频、正式模型权重、标注数据或包含私人路径的完整日志。
  - type: dropdown
    id: stage
    attributes:
      label: 问题阶段
      options:
        - 安装环境
        - 启动界面
        - 导入或浏览视频
        - 标注与保存
        - 创建数据版本
        - 训练模型
        - 模型识别
        - 选择与追踪目标
        - 导出视频或 CSV
        - 时间轨迹与圆圈残影
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 代码版本
      description: 请填写 commit SHA，可运行 git rev-parse --short HEAD 获取。
      placeholder: 例如 1a2b3c4
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与硬件
      placeholder: Windows 11；RTX 4060 8 GB，或 CPU-only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始，逐步写出点击或运行了什么。
      placeholder: |
        1. 双击 start_tracker.cmd
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误文字
      description: 可粘贴已经检查过隐私的错误片段。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 可选附件
      description: 截图或已清理隐私的日志。请不要上传科研原始数据。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查附件，不含未经授权的原始数据、模型、标注、私人路径或其他敏感信息。
          required: true
